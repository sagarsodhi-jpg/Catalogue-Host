<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Button Parotta &amp; Mutton</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Hanken+Grotesk:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: one-column phone app. Customer = hero, sticky category tabs, menu rows, bottom order dock.
   Owner = tabbed dashboard; the order board becomes three columns on wide screens. */
:root{
  --bg:#14100c; --surface:#1d1712; --surface-2:#292018; --line:#3b2f23;
  --fg:#f4eadb; --muted:#b19d83;
  --accent:#f0a43a; --accent-fg:#1c1206; --accent-soft:#3a2a12;
  --ok:#74c487; --ok-fg:#0d2415; --ok-soft:#1b3022;
  --bad:#ef6a52; --bad-fg:#2a0d07; --bad-soft:#3a1d17;
  --veg:#4cb86a; --nonveg:#d2523c;
  --font-display:'Young Serif',Georgia,'Times New Roman',serif;
  --font-body:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'DM Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f5efe6; --surface:#fffaf2; --surface-2:#efe5d6; --line:#ddd0bc;
    --fg:#2a1f14; --muted:#74624a;
    --accent:#b4620a; --accent-fg:#fff8ec; --accent-soft:#f6e3c4;
    --ok:#2c7a42; --ok-fg:#f2fff5; --ok-soft:#dcefdc;
    --bad:#b53a22; --bad-fg:#fff5f2; --bad-soft:#f6dcd4;
    --veg:#2a8a4a; --nonveg:#b8402c;
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#f5efe6; --surface:#fffaf2; --surface-2:#efe5d6; --line:#ddd0bc;
  --fg:#2a1f14; --muted:#74624a;
  --accent:#b4620a; --accent-fg:#fff8ec; --accent-soft:#f6e3c4;
  --ok:#2c7a42; --ok-fg:#f2fff5; --ok-soft:#dcefdc;
  --bad:#b53a22; --bad-fg:#fff5f2; --bad-soft:#f6dcd4;
  --veg:#2a8a4a; --nonveg:#b8402c;
  color-scheme:light;
}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.5 var(--font-body);-webkit-font-smoothing:antialiased;min-height:100%}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.45}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.lbl{font:500 11.5px/1 var(--font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px}
.wrap.wide{max-width:1180px}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px}
.bar.cust .wrap{justify-content:space-between;min-height:66px}
.cname{min-width:0;display:flex;flex-direction:column;gap:3px}
.cname b{font-family:var(--font-display);font-weight:400;font-size:24px;line-height:1.05;overflow-wrap:anywhere}
.cname small{font:500 12px/1.2 var(--font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.logo{width:52px;height:52px;border-radius:50%;display:block;flex:none}
.eyebrow{font:500 12px/1 var(--font-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.brand{font-family:var(--font-display);font-size:20px;line-height:1.15;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand small{font:500 12px var(--font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-left:8px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface);flex:none}
.seg button{border:0;background:transparent;padding:5px 13px;border-radius:999px;color:var(--muted);font-weight:600;font-size:14px;min-height:32px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.hbtns{display:flex;align-items:center;gap:10px;flex:none}
.live{display:inline-flex;align-items:center;gap:7px;font:500 12px var(--font-mono);color:var(--muted);white-space:nowrap}
.live::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--ok)}
.live.local::before{background:var(--accent)}
.demo{background:var(--accent-soft);border-bottom:1px solid var(--line);font-size:13.5px}
.demo .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:8px;flex-wrap:wrap}
.demo .seg button{padding:3px 11px;min-height:28px;font-size:13px}

/* hero */
.hero{padding-block:22px 4px;background:radial-gradient(70% 90% at 0% 0%,var(--accent-soft),transparent 70%)}
.hero h1{font-family:var(--font-display);font-weight:400;font-size:clamp(34px,10vw,54px);line-height:1.03;margin:0 0 12px;text-wrap:balance}
.hero p{margin:0;color:var(--muted);max-width:44ch}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:0}
.chip{display:inline-flex;align-items:center;gap:8px;padding:7px 13px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:14px;font-weight:500}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.chip.warn .dot{background:var(--bad)}
.notice{margin-top:16px;padding:12px 14px;border-radius:12px;background:var(--bad-soft);border:1px solid var(--bad);font-size:14.5px}
.notice.soft{background:var(--accent-soft);border-color:var(--accent)}

/* category tabs */
.cats{position:sticky;top:calc(env(safe-area-inset-top,0px) + 67px);z-index:15;background:var(--bg);margin-top:18px;border-bottom:1px solid var(--line)}
.cats .wrap{display:flex;gap:8px;overflow-x:auto;padding-block:10px;scrollbar-width:none}
.cat{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:7px 15px;border-radius:999px;font-weight:600;font-size:14.5px;min-height:38px}
.cat[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}

/* menu */
.sec{padding-top:26px;scroll-margin-top:140px}
.sec h2{font-family:var(--font-display);font-weight:400;font-size:27px;line-height:1.2;margin:0 0 4px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sec h2 small{font:500 15px var(--font-body);color:var(--muted)}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 16px;padding:16px 0;border-bottom:1px solid var(--line)}
.item .info{display:flex;gap:11px;align-items:flex-start;min-width:0}
.item .t{font-weight:600;font-size:17px;line-height:1.25}
.item .d{color:var(--muted);font-size:13.5px;margin-top:5px;max-width:42ch}
.item .side{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.item .pr{font-weight:600;font-size:17px;font-variant-numeric:tabular-nums}
.item.out .info,.item.out .pr{opacity:.5}
.soon{margin-top:12px;padding:26px 16px;border:1.5px dashed var(--line);border-radius:16px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;color:var(--muted)}
.soon b{font-family:var(--font-display);font-weight:400;font-size:22px;color:var(--accent)}
.vd{flex:none;width:15px;height:15px;margin-top:3px;border:1.5px solid var(--veg);border-radius:3px;display:inline-grid;place-items:center}
.vd::after{content:'';width:7px;height:7px;border-radius:50%;background:var(--veg)}
.vd.nv{border-color:var(--nonveg)}
.vd.nv::after{background:var(--nonveg)}
.add{border:1.5px solid var(--accent);color:var(--accent);background:transparent;border-radius:12px;padding:0 22px;min-height:40px;font-weight:700;letter-spacing:.03em}
.add:hover:not(:disabled){background:var(--accent);color:var(--accent-fg)}
.step{display:inline-flex;align-items:center;border:1.5px solid var(--accent);border-radius:12px;overflow:hidden;background:var(--accent-soft)}
.step button{border:0;background:transparent;color:var(--accent);width:40px;min-height:38px;display:grid;place-items:center}
.step span{min-width:30px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.tag-out{font:500 11.5px var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--bad);border:1px solid var(--bad);border-radius:6px;padding:4px 9px}
.foot{padding-block:30px 10px;color:var(--muted);font-size:13.5px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.foot button{background:none;border:0;color:var(--muted);text-decoration:underline;padding:0}
.spacer{height:220px}

/* dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;padding-bottom:env(safe-area-inset-bottom,0px);pointer-events:none}
.dock .wrap{display:flex;flex-direction:column;gap:10px;padding-block:12px}
.dock button{pointer-events:auto}
.dockcard{pointer-events:auto;background:var(--surface-2);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.dhead{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;border:0;background:transparent;padding:12px 16px 8px;text-align:left;color:var(--fg);font-weight:600;font-size:15px}
.dhead .tk{font-family:var(--font-display);font-weight:400;font-size:22px;color:var(--accent);margin-right:8px}
.dlive{display:inline-flex;align-items:center;gap:7px;color:var(--muted);font-weight:500;font-size:13.5px}
.dsteps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:2px 16px 12px}
.dsteps div{display:flex;flex-direction:column;gap:6px;font-size:12.5px;font-weight:600;color:var(--muted)}
.dsteps div::before{content:'';height:5px;border-radius:3px;background:var(--line)}
.dsteps div.on{color:var(--fg)}
.dsteps div.on::before{background:var(--accent)}
.dsteps div.done::before{background:var(--ok)}
.dsteps div.ready{color:var(--ok)}
.dsteps div.ready::before{background:var(--ok)}
.dbtn{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;border:0;border-radius:0;background:var(--accent);color:var(--accent-fg);padding:15px 18px;font-weight:700;font-size:16px}
.dbtn .r{display:inline-flex;align-items:center;gap:8px}
.dbtn.ok{background:var(--ok);color:var(--ok-fg)}
.dbtn.alt{background:var(--surface);color:var(--fg);border-top:1px solid var(--line)}
.cartbar,.trackbar{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;border:0;border-radius:16px;padding:14px 18px;font-weight:700;font-size:16px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.cartbar{background:var(--accent);color:var(--accent-fg)}
.trackbar{background:var(--surface-2);color:var(--fg);border:1px solid var(--line)}
.trackbar .tk{font-family:var(--font-display);font-size:20px;font-weight:400;color:var(--accent)}

/* sheets */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(10,7,4,.66);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:92vh;max-height:92dvh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(26px);opacity:0}to{transform:none;opacity:1}}
.sh-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sh-head h3{font-family:var(--font-display);font-weight:400;font-size:25px;margin:0}
.x{border:1px solid var(--line);background:var(--surface-2);border-radius:50%;width:38px;height:38px;display:grid;place-items:center;flex:none}
.line{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.line .ln{min-width:0}
.line .ln b{font-weight:600}
.line .lp{font-variant-numeric:tabular-nums;font-weight:600;margin-left:auto;white-space:nowrap}
.totalrow{display:flex;justify-content:space-between;align-items:baseline;font-size:18px}
.totalrow strong{font-family:var(--font-display);font-weight:400;font-size:32px;font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:54px;border-radius:14px;border:0;background:var(--accent);color:var(--accent-fg);font-weight:700;font-size:17px;padding:0 20px;text-decoration:none}
.btn.ghost{background:transparent;color:var(--fg);border:1.5px solid var(--line)}
.btn.ok{background:var(--ok);color:var(--ok-fg)}
.btn.bad{background:var(--bad);color:var(--bad-fg)}
.btn.armed{outline:3px solid var(--bad);outline-offset:2px}
.mini{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--line);background:var(--surface-2);color:var(--fg);border-radius:10px;padding:0 13px;min-height:38px;font-weight:600;font-size:14px}
.mini.ok{background:var(--ok);border-color:var(--ok);color:var(--ok-fg)}
.mini.acc{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.payamt{text-align:center;padding-block:4px}
.payamt .big{font-family:var(--font-display);font-size:52px;line-height:1.1;font-variant-numeric:tabular-nums}
.qrwrap{display:flex;flex-direction:column;align-items:center;gap:8px}
.qrbox{background:#fff;padding:12px;border-radius:14px;width:fit-content;min-width:116px;min-height:116px}
.qrbox img,.qrbox canvas{display:block;max-width:100%}
.qrfail{color:#333;font-size:13px;padding:30px 10px}
.qrcap{font-size:13.5px;color:var(--muted);text-align:center}
.upirow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg)}
.upirow .mono{font-size:15px;overflow-wrap:anywhere}
.refrow{font-size:14px;color:var(--muted);text-align:center}
.help{font-size:13.5px;color:var(--muted);margin:0}

/* tracker */
.tkhead{text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;padding-block:4px}
.token{font-family:var(--font-display);font-size:92px;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.token.wait{font-size:44px;color:var(--muted)}
.tkmsg{font-family:var(--font-display);font-size:25px;line-height:1.2;text-wrap:balance}
.ring{display:inline-grid;place-items:center;padding:8px 26px;border-radius:24px}
.ring.pulse{box-shadow:0 0 0 0 var(--ok);animation:pulse 1.8s ease-out infinite;background:var(--ok-soft)}
.ring.pulse .token{color:var(--ok)}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 55%,transparent)}100%{box-shadow:0 0 0 22px transparent}}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.steps div{display:flex;flex-direction:column;gap:7px;font-size:13px;font-weight:600;color:var(--muted)}
.steps div::before{content:'';height:6px;border-radius:3px;background:var(--line)}
.steps div.on{color:var(--fg)}
.steps div.on::before{background:var(--accent)}
.steps div.done::before{background:var(--ok)}
.sum{border-top:1px solid var(--line);padding-top:10px;font-size:14.5px;display:flex;flex-direction:column;gap:3px}
.sum div{display:flex;justify-content:space-between;gap:12px}

/* owner */
.tabs .wrap{display:flex;gap:6px;overflow-x:auto;padding-block:12px;scrollbar-width:none}
.tab{flex:none;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:0 16px;min-height:42px;border-radius:12px;font-weight:600}
.tab[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.tab .n{font:600 12px var(--font-mono);background:var(--bad);color:var(--bad-fg);border-radius:999px;padding:2px 7px}
.panel{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.panel .row{display:flex;gap:8px;flex-wrap:wrap}
.ctl{display:flex;flex-direction:column;gap:10px;padding-top:14px}
.alertbtn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1.5px dashed var(--accent);background:var(--accent-soft);border-radius:14px;padding:12px 14px;font-weight:600}
.alertbtn small{display:block;color:var(--muted);font-weight:400;font-size:13px}
.batch{padding:14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:10px;margin-top:14px}
.batch .row{display:flex;flex-wrap:wrap;gap:8px}
.bchip{display:inline-flex;gap:7px;align-items:baseline;padding:7px 12px;border-radius:10px;background:var(--accent-soft);border:1px solid var(--line);font-weight:500}
.bchip b{font-family:var(--font-display);font-weight:400;font-size:20px;color:var(--accent)}
.board{display:grid;grid-template-columns:minmax(0,1fr);gap:22px;margin-top:18px}
@media (min-width:900px){.board{grid-template-columns:repeat(3,minmax(0,1fr));align-items:start}}
.col h3{display:flex;align-items:center;justify-content:space-between;margin:0 0 10px;font:600 13px var(--font-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.col h3 .cnt{background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:2px 10px;color:var(--fg)}
.col .stack{display:flex;flex-direction:column;gap:12px}
.empty{padding:22px 14px;border:1px dashed var(--line);border-radius:14px;text-align:center;color:var(--muted);font-size:14px}
.oc{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:11px}
.oc .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.oc .tok{font-family:var(--font-display);font-size:38px;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.oc .refb{display:flex;flex-direction:column;gap:5px}
.oc .refb b{font-size:18px}
.pill{display:inline-flex;align-items:center;font:600 11.5px var(--font-mono);letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
.pill.v{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.pill.r{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.pill.w{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.oc ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px;font-size:16px}
.oc li .q{font-family:var(--font-mono);font-weight:500;color:var(--accent);display:inline-block;min-width:2.2em}
.oc .of{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:15px}
.oc .of b{font-size:19px;font-variant-numeric:tabular-nums}
.hint{margin:0;font-size:13.5px;color:var(--muted)}
.oc .acts{display:grid;gap:8px}
.oc .acts.two{grid-template-columns:2fr 1fr}
.oc .btn{min-height:50px;font-size:16px}
.recent{margin-top:22px}
.strip{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px;padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);margin-top:14px}
.oc.sm{padding:12px}
.oc.sm .tok{font-size:28px}
.oc.sm ul{font-size:14.5px}
.oc.kit .tok{font-size:50px}
.oc.kit ul{font-size:20px;gap:5px}
.oc.kit .btn{min-height:62px;font-size:18px}
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px}
.linkrow{display:flex;align-items:center;gap:10px}
.linkrow .in{min-width:0;flex:1}
.qs{display:inline-flex;align-items:center;gap:10px;padding:6px 6px 6px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);font-weight:600;font-size:14px}
.recent summary{cursor:pointer;font-weight:600;color:var(--muted);padding:6px 0}
.rrow{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.rrow span:first-child{min-width:0;overflow-wrap:anywhere}
.sub{margin:0 0 10px;font-family:var(--font-display);font-weight:400;font-size:22px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:16px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.tile b{font-family:var(--font-display);font-weight:400;font-size:34px;line-height:1.05;font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:16px}
.hours{display:flex;align-items:flex-end;gap:4px;height:130px;margin-top:12px}
.hours .hb{flex:1;min-width:0;background:var(--accent);border-radius:5px 5px 0 0;min-height:3px;opacity:.9}
.hours .hb.z{background:var(--line)}
.hlabels{display:flex;gap:4px;margin-top:6px}
.hlabels span{flex:1;min-width:0;text-align:center;font:500 11px var(--font-mono);color:var(--muted)}
.bs{position:relative;display:flex;justify-content:space-between;gap:12px;padding:10px 12px;border-radius:10px;background:var(--bg);overflow:hidden;margin-top:8px}
.bs i{position:absolute;inset:0 auto 0 0;background:var(--accent-soft)}
.bs span{position:relative}
.bs .mono{font-weight:500}
.mrow{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:13px 0;border-bottom:1px solid var(--line)}
.mrow .mn{min-width:0}
.mrow .mn b{font-weight:600}
.mrow .ctrls{display:flex;align-items:center;gap:14px;flex:none}
.pin{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:10px;padding:0 10px;background:var(--bg);min-height:42px}
.pin input{width:72px;border:0;background:transparent;font-variant-numeric:tabular-nums;font-weight:600;text-align:right;outline:0}
.pin:focus-within{border-color:var(--accent)}
.sw{position:relative;width:48px;height:28px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface-2);padding:0;flex:none}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:var(--muted);transition:transform .15s}
.sw[aria-checked="true"]{background:var(--bad-soft);border-color:var(--bad)}
.sw[aria-checked="true"]::after{transform:translateX(20px);background:var(--bad)}
.form{display:flex;flex-direction:column;gap:16px;max-width:520px;margin-top:6px}
.field{display:flex;flex-direction:column;gap:7px}
.in{min-height:50px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);padding:0 14px;width:100%}
.in:focus{outline:0;border-color:var(--accent)}
.eta{display:flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:15px;color:var(--accent)}
.ld{display:inline-block;flex:none;width:8px;height:8px;border-radius:50%;background:var(--ok);animation:blink 1.6s ease-in-out infinite}
@keyframes blink{50%{opacity:.3}}
#toast{position:fixed;left:50%;bottom:calc(200px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;max-width:min(92vw,420px);background:var(--fg);color:var(--bg);padding:11px 18px;border-radius:12px;font-weight:600;font-size:14.5px;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<body>
<div id="app"></div>
<div id="sheet"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
(function(){
'use strict';

/* ---------- helpers ---------- */
const $=(s,r)=>(r||document).querySelector(s);
const $$=(s,r)=>Array.from((r||document).querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rupee=n=>'₹'+Number(n||0).toLocaleString('en-IN');
const now=()=>Date.now();
const ls={g(k){try{return localStorage.getItem(k)}catch(e){return null}},s(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const dayKey=()=>new Date().toLocaleDateString('en-CA');
const svg=(p,w)=>`<svg viewBox="0 0 24 24" width="${w||20}" height="${w||20}" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const I={
  plus:svg('<path d="M12 5v14M5 12h14"/>',18),
  minus:svg('<path d="M5 12h14"/>',18),
  x:svg('<path d="M6 6l12 12M18 6L6 18"/>',18),
  arrow:svg('<path d="M5 12h14M13 6l6 6-6 6"/>',20),
  copy:svg('<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/>',16),
  bell:svg('<path d="M6 17h12l-1.5-2V10a4.5 4.5 0 0 0-9 0v5L6 17zM10 20a2 2 0 0 0 4 0"/>',22),
  check:svg('<path d="M5 12.5l4.5 4.5L19 7"/>',20)
};

/* ---------- menu (owner can change prices in the Menu tab) ---------- */
const DEFAULT_NAME='Laham by Shab Foods';
const CATS=[
  {id:'parotta',en:'Button Parotta with Mutton'},
  {id:'sides',en:'Sides & drinks',soon:true}
];
const MENU=[
  {id:'bpm2',cat:'parotta',veg:0,pcs:2,en:'Half (2 pcs)',d:'2 button parottas served with mutton',price:149},
  {id:'bpm4',cat:'parotta',veg:0,pcs:4,en:'Full (4 pcs)',d:'4 button parottas served with mutton',price:249},
  {id:'bpm6',cat:'parotta',veg:0,pcs:6,en:'Large (6 pcs)',d:'6 button parottas served with mutton',price:349}
];
const MBY={};MENU.forEach(m=>{MBY[m.id]=m;});

/* ---------- copy ---------- */
const L={
en:{
  eyebrow:'Scan · Order · Pay',
  tagline:'Soft layered parottas and slow-cooked mutton, made fresh on the tawa.',
  taking:'Taking orders',paused:'Orders paused',
  pausedMsg:'Orders are paused for a few minutes. Please check back soon.',
  wait:n=>`About ${n} min wait`,upiOnly:'Pay by UPI',
  add:'Add',out:'Sold out',items:n=>n===1?'1 item':`${n} items`,viewOrder:'View order',
  yourOrder:'Your order',empty:'Your order is empty.',total:'Total',toPay:'Continue to pay',
  payTitle:'Pay by UPI',payAmount:'Amount to pay',payOpen:'Open UPI app',
  payScan:'Or scan this QR from another phone',copy:'Copy',copied:'UPI ID copied',payNote:'Payment note',
  iPaid:n=>`I have paid ${rupee(n)}`,demoPay:'Place demo order',
  noUpi:'The cart has not added a UPI ID yet. You can still place a demo order to see how tracking works.',
  upiHelp:'If your UPI app does not open, scan the QR or pay to the UPI ID. Keep the payment note so the cart can find your payment.',
  back:'Back',trackTitle:'Your order',ref:'Order code',
  stCheck:'Payment check',stPrep:'Preparing',stReady:'Ready',
  checkingMsg:'We are checking your payment',checkingSub:'This usually takes a minute. Keep this screen open.',
  prepMsg:'Your order is being made',
  readyMsg:'Your order is ready',readySub:'Please collect it at the counter and show this token.',
  rejectedMsg:'Payment not received',rejectedSub:'We could not find this payment. Please start a new order or talk to the cart.',
  cancelledMsg:'Order cancelled',cancelledSub:'If you already paid, the cart will refund you.',
  doneMsg:'Order collected',doneSub:'Thank you. Enjoy your meal.',
  newOrder:'Start a new order',token:'Token',estLbl:n=>`About ${n} min to go`,
  closeLbl:'Close',readyIn:n=>`Ready in about ${n} min`,soon:'Coming soon',nonveg:'Non-veg',veg:'Veg',addOne:n=>`Add one ${n}`,removeOne:n=>`Remove one ${n}`,soldNow:n=>`${n} just sold out and was removed.`,
  paidTo:'Paid to',cartPaused:'Orders are paused right now.',
  placeFail:'Could not place the order. Please try again.'
}};
const t=(k,...a)=>{const v=L.en[k];return typeof v==='function'?v(...a):v;};

const nm=o=>o.en;
const ds=m=>m.d;
const cn=k=>k.en;

/* ---------- state ---------- */
const S={mode:'init',orders:{},status:{},config:{},days:{},loaded:{orders:false}};
let DB=null,canEditFlag=null;
function viewFromHash(){try{const x=location.hash.replace('#','');return(x==='counter'||x==='kitchen'||x==='owner')?x:'customer';}catch(e){return 'customer';}}
let view=viewFromHash();
let cart={},sheet=null,pending=null,placing=false,active=ls.g('bpm_active')||null;
let ownerTab=(function(){const v=ls.g('bpm_tab');return ['menu','summary','settings'].indexOf(v)>=0?v:'menu';})(),settingsDrawn=false,soundOn=false,actx=null,wake=null,seen=null,lastTok=0,activeCat='parotta';
let resolveReady;const ready=new Promise(r=>{resolveReady=r;});

function cfg(){
  const c=S.config||{};
  return {name:c.name||DEFAULT_NAME,upi:c.upi||'',upiName:c.upiName||'',
    perPiece:Number(c.perPiece)>0?Number(c.perPiece):0.75,link:c.link||'',
    paused:!!c.paused,pausedUntil:Number(c.pausedUntil)||0,soldOut:c.soldOut||{},prices:c.prices||{}};
}
const isPaused=c=>!!(c.paused||c.pausedUntil>now());
function priceOf(m,c){const p=(c||cfg()).prices[m.id];return(p===undefined||p===null||isNaN(+p))?m.price:+p;}
function derive(){
  return Object.keys(S.orders).map(id=>{
    const o=S.orders[id]||{},st=S.status[id]||null;
    return {id,ref:o.ref||'----',createdAt:Number(o.createdAt)||0,items:Array.isArray(o.items)?o.items:[],total:Number(o.total)||0,st,state:(st&&st.state)||'verify'};
  }).sort((a,b)=>a.createdAt-b.createdAt);
}
const BUF=1.5;
const pcsOf=o=>o.items.reduce((a,i)=>a+(Number(i.qty)||0)*((MBY[i.id]&&MBY[i.id].pcs)||2),0);
/* One cook, first come first served. Each order takes (pieces x minutes per piece). */
function schedule(){
  const per=cfg().perPiece,n=now(),list=derive(),eta={};
  let cur=0;
  list.filter(o=>o.state==='preparing').sort((a,b)=>(a.st.confirmedAt||0)-(b.st.confirmedAt||0)).forEach(o=>{
    const start=Math.max(o.st.confirmedAt||o.createdAt,cur);
    let end=start+pcsOf(o)*per*60000;
    if(end<n)end=n+20000;
    eta[o.id]=end;cur=end;
  });
  list.filter(o=>o.state==='verify'&&n-o.createdAt<15*60000).forEach(o=>{
    const end=Math.max(cur,n)+pcsOf(o)*per*60000;
    eta[o.id]=end;cur=end;
  });
  return {eta:eta,end:Math.max(cur,n)};
}
const toMins=ms=>Math.max(1,Math.ceil(ms/60000));
function waitMins(){return toMins(schedule().end-now()+(BUF+cfg().perPiece*2)*60000);}
function newOrderMins(pcs){return toMins(schedule().end-now()+(BUF+cfg().perPiece*pcs)*60000);}
function etaMins(id){
  const e=schedule().eta[id];if(!e)return null;
  const st=S.status[id];
  return toMins(e-now()+((st&&st.state)?0:BUF*60000));
}
const etaLine=m=>`<div class="eta"><i class="ld"></i>${t('readyIn',m)}</div>`;
const linesPcs=ls_=>ls_.reduce((a,l)=>a+l.qty*((MBY[l.id]&&MBY[l.id].pcs)||2),0);
function deepMerge(a,b){
  const r=Object.assign({},a);
  Object.keys(b).forEach(k=>{
    const v=b[k];
    r[k]=(v&&typeof v==='object'&&!Array.isArray(v))?deepMerge((a&&a[k]&&typeof a[k]==='object')?a[k]:{},v):v;
  });
  return r;
}

/* ---------- storage backends ---------- */
const queues={};
function enq(key,fn){
  const p=(queues[key]||Promise.resolve()).then(fn);
  queues[key]=p.catch(()=>{});
  return p.catch(e=>{console.error(e);toast('Could not save. Check the connection and try again.');});
}
const LKEY='bpm_demo_state_v1';
function loadLocal(){try{const j=JSON.parse(ls.g(LKEY)||'{}');S.orders=j.orders||{};S.status=j.status||{};S.config=j.config||{};S.days=j.days||{};}catch(e){}}
function saveLocal(){ls.s(LKEY,JSON.stringify({orders:S.orders,status:S.status,config:S.config,days:S.days}));}
window.addEventListener('storage',e=>{if(e.key===LKEY&&S.mode==='local'){loadLocal();onData();}});

async function putOrder(id,o){
  if(S.mode==='db'){await DB.doc('orders/'+id).set(o);}
  else{S.orders=Object.assign({},S.orders,{[id]:o});saveLocal();onData();}
}
function putStatus(id,patch){
  return enq('s/'+id,async()=>{
    const next=Object.assign({},S.status[id]||{},patch,{updatedAt:now()});
    if(S.mode==='db'){await DB.doc('status/'+id).set(next);}
    else{S.status=Object.assign({},S.status,{[id]:next});saveLocal();onData();}
  });
}
function putConfig(patch){
  return enq('cfg',async()=>{
    const next=deepMerge(S.config||{},patch);
    if(S.mode==='db'){await DB.doc('config/shop').set(next);}
    else{S.config=next;saveLocal();onData();}
  });
}
function putDay(key,v){
  return enq('d/'+key,async()=>{
    if(S.mode==='db'){await DB.doc('days/'+key).set(v);}
    else{S.days=Object.assign({},S.days,{[key]:v});saveLocal();onData();}
  });
}
async function delOrder(id){
  if(S.mode==='db'){await DB.doc('orders/'+id).delete();await DB.doc('status/'+id).delete();}
  else{const o=Object.assign({},S.orders),s=Object.assign({},S.status);delete o[id];delete s[id];S.orders=o;S.status=s;saveLocal();}
}

async function init(){
  let d=null;
  try{if(window.claude&&window.claude.use)d=await window.claude.use('db');}catch(e){d=null;}
  if(d){
    DB=d;S.mode='db';
    try{const u=await window.claude.use('user');if(u&&u.canEdit)canEditFlag=!!(await u.canEdit());}catch(e){}
    const err=e=>{console.error(e);};
    DB.collection('orders').orderBy('createdAt','desc').limit(400).onSnapshot(snap=>{
      const o={};snap.docs.forEach(x=>{o[x.id]=x.data();});S.orders=o;S.loaded.orders=true;onData();
    },err);
    DB.collection('status').orderBy('updatedAt','desc').limit(600).onSnapshot(snap=>{
      const o={};snap.docs.forEach(x=>{o[x.id]=x.data();});S.status=o;onData();
    },err);
    DB.doc('config/shop').onSnapshot(snap=>{S.config=snap.exists?snap.data():{};onData();},err);
    if(canEditFlag){
      DB.collection('days').orderBy('date','desc').limit(14).onSnapshot(snap=>{
        const o={};snap.docs.forEach(x=>{o[x.id]=x.data();});S.days=o;onData();
      },err);
    }
  }else{
    S.mode='local';loadLocal();S.loaded.orders=true;seen=new Set(Object.keys(S.orders));
  }
  resolveReady();onData();
}

/* ---------- alerts ---------- */
const seenK={order:null,cook:null,ready:null};
function freshIds(kind,ids){
  if(seenK[kind]===null){seenK[kind]=new Set(ids);return [];}
  const out=[];
  ids.forEach(id=>{if(!seenK[kind].has(id)){seenK[kind].add(id);out.push(id);}});
  return out;
}
function checkNew(){
  if(!S.loaded.orders)return;
  const list=derive(),n=now();
  const fo=freshIds('order',Object.keys(S.orders)).filter(id=>n-((S.orders[id]||{}).createdAt||0)<3*60000);
  const fc=freshIds('cook',list.filter(o=>o.state==='preparing').map(o=>o.id)).filter(id=>n-((S.status[id]||{}).confirmedAt||0)<3*60000);
  const fr=freshIds('ready',list.filter(o=>o.state==='ready').map(o=>o.id)).filter(id=>n-((S.status[id]||{}).readyAt||0)<3*60000);
  if(view==='counter'&&(fo.length||fr.length))chime(fo.length?'order':'ready');
  if(view==='kitchen'&&fc.length)chime('cook');
}
function chime(kind){
  if(!soundOn||!actx)return;
  try{
    const t0=actx.currentTime;
    (kind==='cook'?[[660,0],[660,.22]]:kind==='ready'?[[988,0],[1318,.16]]:[[880,0],[1175,.16],[880,.34]]).forEach(p=>{
      const o=actx.createOscillator(),g=actx.createGain();
      o.type='sine';o.frequency.value=p[0];
      g.gain.setValueAtTime(0.0001,t0+p[1]);
      g.gain.linearRampToValueAtTime(.35,t0+p[1]+.02);
      g.gain.exponentialRampToValueAtTime(.0001,t0+p[1]+.3);
      o.connect(g);g.connect(actx.destination);o.start(t0+p[1]);o.stop(t0+p[1]+.32);
    });
  }catch(e){}
}
async function enableSound(){
  try{const AC=window.AudioContext||window.webkitAudioContext;if(AC&&!actx)actx=new AC();if(actx&&actx.resume)await actx.resume();}catch(e){}
  soundOn=true;chime();
  try{if(navigator.wakeLock){wake=await navigator.wakeLock.request('screen');}}catch(e){}
  refresh();
}
document.addEventListener('visibilitychange',()=>{
  if(!document.hidden&&soundOn&&navigator.wakeLock&&(!wake||wake.released)){navigator.wakeLock.request('screen').then(w=>{wake=w;}).catch(()=>{});}
});

/* ---------- toast ---------- */
let toastT=0;
function toast(msg){
  const el=$('#toast');if(!el)return;
  el.textContent=msg;el.classList.add('show');
  clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('show'),2800);
}

/* ---------- QR ---------- */
function drawQR(el,text,size){
  if(!el)return;el.innerHTML='';
  try{
    if(window.QRCode){new QRCode(el,{text:text,width:size,height:size,colorDark:'#000000',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M});}
    else{el.innerHTML='<div class="qrfail">QR unavailable. Use the UPI ID.</div>';}
  }catch(e){el.innerHTML='<div class="qrfail">QR unavailable. Use the UPI ID.</div>';}
}
function upiLink(c,amount,ref){
  return 'upi://pay?pa='+c.upi+'&pn='+encodeURIComponent(c.upiName||c.name)+'&am='+encodeURIComponent(String(amount))+'&cu=INR&tn='+encodeURIComponent('BPM-'+ref);
}

let rafId=0;
function refresh(){if(rafId)return;rafId=requestAnimationFrame(()=>{rafId=0;doRefresh();});}
function onData(){checkNew();refresh();}
function doRefresh(){
  renderDemo();
  if(view!=='customer')refreshOwner();else refreshCustomer();
  if(sheet==='track')renderSheet();
}
function renderDemo(){
  const el=$('#demo');if(!el)return;
  if(S.mode!=='local'){el.innerHTML='';return;}
  el.innerHTML=`<div class="demo"><div class="wrap wide"><span>Demo mode. Orders stay on this device only and do not reach the cart.</span></div></div>`;
}
function ownerOk(){return S.mode==='local'||canEditFlag===true;}
function curTab(){return view==='owner'?(['menu','summary','settings'].indexOf(ownerTab)>=0?ownerTab:'menu'):view;}

/* ---------- customer ---------- */
function cartLines(){
  const c=cfg();
  return Object.keys(cart).filter(id=>cart[id]>0&&MBY[id]).map(id=>{
    const m=MBY[id];return {id:id,qty:cart[id],price:priceOf(m,c),en:m.en,out:!!c.soldOut[id]};
  });
}
const cartCount=()=>cartLines().reduce((a,l)=>a+l.qty,0);
const cartTotal=()=>cartLines().reduce((a,l)=>a+l.qty*l.price,0);
function stateLabel(s){return t({verify:'stCheck',preparing:'stPrep',ready:'stReady',done:'doneMsg',cancelled:'cancelledMsg',rejected:'rejectedMsg'}[s]||'stCheck');}

function soonBlock(){return `<div class="soon"><b>${t('soon')}</b></div>`;}
function itemRow(m,c,paused){
  const so=!!c.soldOut[m.id],q=cart[m.id]||0;
  let ctl;
  if(so)ctl=`<span class="tag-out">${t('out')}</span>`;
  else if(q)ctl=`<div class="step"><button data-act="dec" data-id="${m.id}" aria-label="${esc(t('removeOne',nm(m)))}">${I.minus}</button><span>${q}</span><button data-act="add" data-id="${m.id}" aria-label="${esc(t('addOne',nm(m)))}" ${paused?'disabled':''}>${I.plus}</button></div>`;
  else ctl=`<button class="add" data-act="add" data-id="${m.id}" ${paused?'disabled':''}>${t('add')}</button>`;
  return `<div class="item${so?' out':''}"><div class="info"><span class="vd${m.veg?'':' nv'}" role="img" aria-label="${m.veg?t('veg'):t('nonveg')}"></span><div><div class="t">${esc(nm(m))}</div><div class="d">${esc(ds(m))}</div></div></div><div class="side"><div class="pr">${rupee(priceOf(m,c))}</div>${ctl}</div></div>`;
}
function dockHTML(){
  if(sheet)return '';
  const n=cartCount(),o=(active&&S.orders[active])?S.orders[active]:null;
  if(!n&&!o)return '';
  const st=o?(S.status[active]||{}):{},state=o?(st.state||'verify'):null;
  const terminal=!!state&&['done','cancelled','rejected'].indexOf(state)>=0;
  const idx=!o?-1:state==='verify'?0:state==='preparing'?1:2;
  const labels=[t('stCheck'),t('stPrep'),t('stReady')];
  let head;
  if(o){
    const em=terminal?null:etaMins(active);
    head=`<button class="dhead" data-act="openTrack"><span><b class="tk">${st.token?'#'+st.token:esc(o.ref)}</b>${terminal?esc(stateLabel(state)):''}${em?`<span class="dlive"><i class="ld"></i>${t('readyIn',em)}</span>`:''}</span>${I.arrow}</button>`;
  }else{
    head=`<div class="dhead static"><span class="lbl">What happens after you pay</span></div>`;
  }
  const steps=terminal?'':`<div class="dsteps">${labels.map((s,i)=>{
    const cls=!o?'':(state==='ready'&&i===2)?'ready':i<idx?'done':i===idx?'on':'';
    return `<div class="${cls}">${esc(s)}</div>`;}).join('')}</div>`;
  let btn;
  if(n>0)btn=`<button class="dbtn" data-act="openCart"><span>${t('items',n)} \u00B7 ${rupee(cartTotal())}</span><span class="r">${t('viewOrder')} ${I.arrow}</span></button>`;
  else if(state==='ready')btn=`<button class="dbtn ok" data-act="openTrack"><span>${t('readyMsg')}</span><span class="r">${t('token')} #${esc(st.token)} ${I.arrow}</span></button>`;
  else btn=`<button class="dbtn alt" data-act="openTrack"><span>${t('trackTitle')}</span><span class="r">${I.arrow}</span></button>`;
  return `<div class="dockcard">${head}${steps}${btn}</div>`;
}
function refreshCustomer(){
  if(!$('#c-hero'))return;
  const c=cfg(),paused=isPaused(c);
  const mm=/^(.*?)\s+by\s+(.+)$/i.exec(c.name);
  $('#c-name').innerHTML=mm?`<b>${esc(mm[1])}</b><small>by ${esc(mm[2])}</small>`:`<b>${esc(c.name)}</b>`;

async function placeOrder(){
  if(placing||!pending)return;
  const c=cfg();
  if(isPaused(c)){toast(t('cartPaused'));return;}
  placing=true;renderSheet();
  try{
    await ready;
    const id=now().toString(36)+'-'+pending.ref;
    const order={ref:pending.ref,createdAt:now(),items:pending.items,total:pending.total};
    await putOrder(id,order);
    active=id;ls.s('bpm_active',id);
    cart={};pending=null;sheet='track';
  }catch(e){
    console.error(e);toast(t('placeFail'));
  }finally{placing=false;}
  renderSheet();refresh();
}

function summaryData(){
  const key=dayKey(),start=new Date();start.setHours(0,0,0,0);
  const base=S.days[key]||{};
  let orders=Number(base.orders)||0,revenue=Number(base.revenue)||0;
  const items=Object.assign({},base.items||{}),hours=Object.assign({},base.hours||{});
  derive().filter(o=>o.createdAt>=start.getTime()&&['preparing','ready','done'].indexOf(o.state)>=0).forEach(o=>{
    orders++;revenue+=o.total;
    o.items.forEach(i=>{items[i.id]=(items[i.id]||0)+(Number(i.qty)||0);});
    const h=new Date(o.createdAt).getHours();hours[h]=(hours[h]||0)+1;
  });
  return {orders,revenue,items,hours};
}

<div class="field"><label class="lbl" for="s-name">Cart name</label><input class="in" id="s-name" value="${esc(c.name)}" maxlength="40"></div>
<div class="field"><label class="lbl" for="s-upi">UPI ID that receives payments</label><input class="in" id="s-upi" value="${esc(c.upi)}" placeholder="name@bank" autocapitalize="off" autocomplete="off" spellcheck="false"></div>
<div class="field"><label class="lbl" for="s-payee">Name shown in the UPI app</label><input class="in" id="s-payee" value="${esc(c.upiName)}" maxlength="40" placeholder="${esc(c.name)}"></div>
<div class="field"><label class="lbl" for="s-per">Minutes to cook one piece</label><input class="in" id="s-per" type="number" inputmode="decimal" min="0.1" step="0.05" value="${c.perPiece}"><p class="hint" style="margin:0">Wait times are worked out live from the pieces in the orders you are making right now. Half is 2 pieces, Full 4, Large 6.</p></div>
<div class="field"><label class="lbl" for="s-link">Page link for the cart QR</label><input class="in" id="s-link" value="${esc(link)}" placeholder="Paste the share link of this page" autocapitalize="off" spellcheck="false"></div>
<div class="qrwrap" style="align-items:flex-start"><div id="qr-cart" class="qrbox"></div><div class="qrcap" style="text-align:left;max-width:34ch">Take a screenshot of this QR and print it for the cart. Customers scan it to open the menu.</div></div>
<div class="field"><span class="lbl">Staff pages, open on their own phones</span>
<div class="linkrow"><label class="lbl" for="st-counter" style="min-width:64px">Counter</label><input class="in" id="st-counter" readonly value="${esc(stLink(link,'counter'))}"><button class="mini" data-act="copyLink" data-id="st-counter">Copy</button></div>
<div class="linkrow"><label class="lbl" for="st-kitchen" style="min-width:64px">Kitchen</label><input class="in" id="st-kitchen" readonly value="${esc(stLink(link,'kitchen'))}"><button class="mini" data-act="copyLink" data-id="st-kitchen">Copy</button></div>
<p class="hint" style="margin:0">Each page shows only that person's work. They need edit access to this page. Customers only get the plain link, with nothing added at the end.</p></div>
<button class="btn" data-act="saveSettings" style="max-width:320px">Save settings</button></div>`;
  drawQR($('#qr-cart'),link||'https://example.com',168);
}

/* ---------- confirm-tap ---------- */
const armed={key:null,t:0,btn:null,label:''};
function needConfirm(btn){
  const key=btn.dataset.act+'|'+(btn.dataset.id||'');
  if(armed.key===key&&now()-armed.t<4000){armed.key=null;return false;}
  if(armed.btn&&armed.btn.isConnected&&armed.label){armed.btn.textContent=armed.label;armed.btn.classList.remove('armed');}
  armed.key=key;armed.t=now();armed.btn=btn;armed.label=btn.textContent;
  btn.textContent=btn.dataset.confirm;btn.classList.add('armed');
  setTimeout(()=>{if(armed.btn===btn&&armed.key===key&&btn.isConnected){btn.textContent=armed.label;btn.classList.remove('armed');armed.key=null;}},4000);
  return true;
}

/* ---------- actions ---------- */
function nextToken(){
  const m=Math.max(0,lastTok,...derive().map(o=>(o.st&&Number(o.st.token))||0));
  lastTok=m+1;return lastTok;
}
async function closeDay(){
  const list=derive(),n=now();
  const fin=list.filter(o=>['done','cancelled','rejected'].indexOf(o.state)>=0||(o.state==='verify'&&n-o.createdAt>12*3600e3));
  if(!fin.length){toast('Nothing to close yet.');return;}
  const key=dayKey(),prev=S.days[key]||{};
  const sum={date:key,orders:Number(prev.orders)||0,revenue:Number(prev.revenue)||0,items:Object.assign({},prev.items||{}),hours:Object.assign({},prev.hours||{}),closedAt:n};
  fin.filter(o=>o.state==='done').forEach(o=>{
    sum.orders++;sum.revenue+=o.total;
    o.items.forEach(i=>{sum.items[i.id]=(sum.items[i.id]||0)+(Number(i.qty)||0);});
    const h=new Date(o.createdAt).getHours();sum.hours[h]=(sum.hours[h]||0)+1;
  });
  try{
    await putDay(key,sum);
    for(let i=0;i<fin.length;i+=8){await Promise.all(fin.slice(i,i+8).map(o=>delOrder(o.id)));}
    lastTok=0;
    if(S.mode==='local')onData();
    toast('Day closed. Finished orders cleared.');
  }catch(e){console.error(e);toast('Could not close the day. Try again.');}
}
function saveSettings(){
  const name=$('#s-name').value.trim()||DEFAULT_NAME;
  const upi=$('#s-upi').value.trim();
  const payee=$('#s-payee').value.trim();
  const per=parseFloat($('#s-per').value);
  const link=$('#s-link').value.trim();
  if(upi&&!/^[A-Za-z0-9._-]{2,}@[A-Za-z][A-Za-z0-9]{1,}$/.test(upi)){toast('That UPI ID looks wrong. Use the form name@bank.');return;}
  putConfig({name:name,upi:upi,upiName:payee,perPiece:per>0?per:0.75,link:link}).then(()=>toast('Saved.'));
}
function clearArmedLater(){armed.key=null;}

document.addEventListener('click',function(e){
  const tg=e.target;
  if(tg.classList&&tg.classList.contains('scrim')){closeSheet();return;}
  const b=tg.closest?tg.closest('[data-act]'):null;
  if(!b||b.disabled)return;
  const a=b.dataset.act,id=b.dataset.id;
  if(b.dataset.confirm&&needConfirm(b))return;
  const c=cfg();
  switch(a){
    case 'cat':{const el=$('#sec-'+id);if(el){activeCat=id;el.scrollIntoView({behavior:'smooth',block:'start'});}refresh();break;}
    case 'add':
      if(isPaused(c)){toast(t('cartPaused'));break;}
      if(c.soldOut[id])break;
      cart[id]=(cart[id]||0)+1;refresh();if(sheet==='cart')renderSheet();break;
    case 'dec':
      cart[id]=Math.max(0,(cart[id]||0)-1);if(!cart[id])delete cart[id];
      refresh();if(sheet==='cart')renderSheet();break;
    case 'openCart':sheet='cart';renderSheet();refresh();break;
    case 'closeSheet':closeSheet();break;
    case 'backCart':sheet='cart';renderSheet();break;
    case 'toPay':{
      if(isPaused(c)){toast(t('cartPaused'));break;}
      const gone=cartLines().filter(l=>l.out);
      if(gone.length){gone.forEach(l=>{delete cart[l.id];});toast(t('soldNow',gone.map(nm).join(', ')));renderSheet();refresh();break;}
      const lines=cartLines();if(!lines.length)break;
      pending={ref:makeRef(),total:cartTotal(),items:lines.map(l=>({id:l.id,qty:l.qty,price:l.price,en:l.en}))};
      sheet='pay';renderSheet();break;
    }
    case 'iPaid':placeOrder();break;
    case 'copyUpi':
      (navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(c.upi):Promise.reject()).then(()=>toast(t('copied'))).catch(()=>toast(c.upi));
      break;
    case 'copyLink':{
      const el=$('#'+id),v=el?el.value:'';
      if(!v){toast('Add the page link first.');break;}
      (navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(v):Promise.reject()).then(()=>toast('Link copied.')).catch(()=>{if(el){el.focus();el.select();}toast('Select the link and copy it.');});
      break;
    }
    case 'openTrack':sheet='track';renderSheet();refresh();break;
    case 'newOrder':active=null;ls.s('bpm_active','');sheet=null;renderSheet();refresh();break;
    case 'tab':ownerTab=id;ls.s('bpm_tab',id);settingsDrawn=false;refresh();break;
    case 'sound':enableSound();break;
    case 'mute':soundOn=false;refresh();break;
    case 'pause10':putConfig({paused:false,pausedUntil:now()+10*60000}).then(()=>toast('Paused for 10 minutes.'));break;
    case 'pauseHold':putConfig({paused:true,pausedUntil:0}).then(()=>toast('Orders paused.'));break;
    case 'resume':putConfig({paused:false,pausedUntil:0}).then(()=>toast('Taking orders again.'));break;
    case 'confirm':{
      const cur=S.status[id];
      putStatus(id,{state:'preparing',token:(cur&&cur.token)||nextToken(),confirmedAt:now()});break;
    }
    case 'reject':putStatus(id,{state:'rejected'});break;
    case 'ready':putStatus(id,{state:'ready',readyAt:now()});break;
    case 'done':putStatus(id,{state:'done',doneAt:now()});break;
    case 'cancel':putStatus(id,{state:'cancelled'}).then(()=>toast('Cancelled. Send the refund from your UPI app.'));break;
    case 'soldout':{const cur=!!c.soldOut[id];putConfig({soldOut:{[id]:!cur}});break;}
    case 'saveSettings':saveSettings();break;
    case 'closeDay':closeDay();break;
  }
});
document.addEventListener('change',function(e){
  const el=e.target;
  if(el.matches&&el.matches('[data-price]')){
    const v=Math.round(Number(el.value));
    if(!isFinite(v)||v<0||el.value===''){toast('Enter a price of 0 or more.');el.value=priceOf(MBY[el.dataset.price]);return;}
    putConfig({prices:{[el.dataset.price]:v}});
  }
});
document.addEventListener('input',function(e){
  if(e.target&&e.target.id==='s-link'){
    ['counter','kitchen'].forEach(r=>{const el=$('#st-'+r);if(el)el.value=stLink(e.target.value.trim(),r);});
    clearTimeout(clearArmedLater.t);
    clearArmedLater.t=setTimeout(()=>drawQR($('#qr-cart'),e.target.value.trim()||'https://example.com',168),350);
  }
});
window.addEventListener('hashchange',()=>{view=viewFromHash();sheet=null;renderSheet();mount();});
setInterval(()=>{if(!document.hidden)refresh();},15000);

mount();
init();
})();
</script>
</body>
</html>
